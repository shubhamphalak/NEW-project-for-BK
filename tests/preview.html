<!doctype html><html lang="en"><meta charset="utf-8"><style>html,body,iframe{margin:0;border:0;width:100%;height:100%;overflow:hidden;display:block}</style><body><script type="module">
import {initialState} from '../src/flow.js';import {advice} from '../src/advisory-client.js';const q=new URLSearchParams(location.search),stage=q.get('stage')||'guest',lang=q.get('lang')||'en';sessionStorage.removeItem('art-advisor-session');let seed={...initialState(),lang,open:stage!=='landing',stage:['thinking','motor','calculator','motor-calculator'].includes(stage)?'home':stage};if(stage==='explore')seed={...seed,messages:[{role:'bot',localized:{en:'Welcome to Explore Insurance. Learn at your own pace, browse insurance topics, or ask me any general question. You do not need to register or share personal details.',ar:'مرحباً بك في استكشاف التأمين. تعلّم بالوتيرة التي تناسبك، أو تصفح موضوعات التأمين، أو اطرح أي سؤال عام. لا تحتاج إلى التسجيل أو مشاركة بيانات شخصية.'}}]};if(stage==='explore-finish')seed={...seed,stage:'explore',exploreView:'finish',messages:[{role:'bot',localized:{en:'You have completed the insurance basics. If you are ready to compare policies or buy, choose the account path that applies to you.',ar:'أكملت أساسيات التأمين. إذا كنت مستعداً لمقارنة الوثائق أو الشراء، فاختر مسار الحساب المناسب لك.'}}]};if(stage==='motor-calculator')seed={...seed,stage:'explore',profile:{category:'motor'},purchaseFlow:{stage:'selected',category:'motor',option:lang==='ar'?'الشامل':'Comprehensive'},messages:[{role:'bot',localized:{en:'Review your selected motor cover and calculate quote readiness.',ar:'راجع تغطية المركبة المختارة واحسب جاهزية عرض السعر.'}}]};if(stage==='motor'){const result=await advice('I bought a new SUV in Riyadh and want good protection without spending too much',{},'home',()=>{});seed={...seed,stage:'advisory',profile:result.profile,advice:result,messages:[{role:'user',raw:lang==='ar'?'اشتريت سيارة دفع رباعي جديدة في الرياض وأريد حماية جيدة':'I bought a new SUV in Riyadh and want good protection.'},{role:'bot',localized:result.reply}]};}sessionStorage.setItem('art-insurance-demo-v1',JSON.stringify(seed));const f=document.createElement('iframe');f.style.width=(q.get('width')||innerWidth)+'px';f.title='ART advisor preview';const loaded=new Promise(r=>f.onload=r);f.src='../index.html';document.body.append(f);await loaded;if(['calculator','motor-calculator'].includes(stage))f.contentDocument.querySelector('[data-insurance-calculator]').click();if(stage==='motor-calculator'){const form=f.contentDocument.querySelector('#motor-calculator-form'),values={vehicleType:'SUV',vehicleMake:'Toyota',vehicleModel:'RAV4',vehicleYear:'2024',vehicleValue:'120000',city:'Riyadh',usage:'personal',driverAge:'35',claims:'0',deductible:'balanced'};for(const [name,value] of Object.entries(values)){form.elements[name].value=value;form.elements[name].dispatchEvent(new f.contentWindow.Event('input',{bubbles:true}));}}if(stage==='thinking'){const input=f.contentDocument.querySelector('#chat-input');input.value='I want life protection for my family';f.contentDocument.querySelector('#message-form').dispatchEvent(new f.contentWindow.Event('submit',{bubbles:true,cancelable:true}));}
</script></body></html>
