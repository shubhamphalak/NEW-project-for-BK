<!doctype html><html lang="en"><meta charset="utf-8"><style>html,body,iframe{margin:0;border:0;width:100%;height:100%;overflow:hidden;display:block}</style><body><script type="module">
import {initialState} from '../src/flow.js';import {advice} from '../src/advisory-client.js';const q=new URLSearchParams(location.search),stage=q.get('stage')||'guest',lang=q.get('lang')||'en';sessionStorage.removeItem('art-advisor-session');let seed={...initialState(),lang,open:stage!=='landing',stage:['thinking','motor','calculator'].includes(stage)?'home':stage};if(stage==='motor'){const result=await advice('I bought a new SUV in Riyadh and want good protection without spending too much',{},'home',()=>{});seed={...seed,stage:'advisory',profile:result.profile,advice:result,messages:[{role:'user',raw:lang==='ar'?'اشتريت سيارة دفع رباعي جديدة في الرياض وأريد حماية جيدة':'I bought a new SUV in Riyadh and want good protection.'},{role:'bot',localized:result.reply}]};}sessionStorage.setItem('art-insurance-demo-v1',JSON.stringify(seed));const f=document.createElement('iframe');f.style.width=(q.get('width')||innerWidth)+'px';f.title='ART advisor preview';const loaded=new Promise(r=>f.onload=r);f.src='../index.html';document.body.append(f);await loaded;if(stage==='calculator')f.contentDocument.querySelector('[data-insurance-calculator]').click();if(stage==='thinking'){const input=f.contentDocument.querySelector('#chat-input');input.value='I want life protection for my family';f.contentDocument.querySelector('#message-form').dispatchEvent(new f.contentWindow.Event('submit',{bubbles:true,cancelable:true}));}
</script></body></html>
