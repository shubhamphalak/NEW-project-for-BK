<!doctype html>
<html lang="en">
<meta charset="utf-8">
<style>
  html, body, iframe { margin: 0; border: 0; width: 100%; height: 100%; overflow: hidden; display: block; }
</style>
<body>
<script type="module">
  import { initialState } from '../src/flow.js';

  const query = new URLSearchParams(location.search);
  const lang = query.get('lang') || 'en';
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
  const until = async callback => {
    for (let attempt = 0; attempt < 200; attempt++) {
      const value = callback();
      if (value) return value;
      await wait(25);
    }
    throw new Error('Motor calculator preview timed out');
  };

  sessionStorage.removeItem('art-advisor-session');
  sessionStorage.setItem('art-insurance-demo-v1', JSON.stringify({
    ...initialState(),
    lang,
    open: true,
    stage: 'explore',
    profile: { category: 'motor' },
    purchaseFlow: { stage: 'selected', category: 'motor', option: lang === 'ar' ? 'الشامل' : 'Comprehensive' },
    messages: [{
      role: 'bot',
      localized: {
        en: 'Review your selected motor cover and calculate quote readiness.',
        ar: 'راجع تغطية المركبة المختارة واحسب جاهزية عرض السعر.'
      }
    }]
  }));

  const frame = document.createElement('iframe');
  frame.style.width = `${query.get('width') || innerWidth}px`;
  frame.title = 'Motor calculator preview';
  const loaded = new Promise(resolve => frame.onload = resolve);
  frame.src = '../index.html';
  document.body.append(frame);
  await loaded;

  const trigger = await until(() => frame.contentDocument.querySelector('[data-insurance-calculator]'));
  trigger.click();
  const form = await until(() => frame.contentDocument.querySelector('#motor-calculator-form'));
  const values = {
    vehicleType: 'SUV',
    vehicleMake: 'Toyota',
    vehicleModel: 'RAV4',
    vehicleYear: '2024',
    vehicleValue: '120000',
    city: 'Riyadh',
    usage: 'personal',
    driverAge: '35',
    claims: '0',
    deductible: 'balanced'
  };
  for (const [name, value] of Object.entries(values)) {
    form.elements[name].value = value;
    form.elements[name].dispatchEvent(new frame.contentWindow.Event('input', { bubbles: true }));
  }
  frame.contentDocument.querySelector('#insurance-calculator').scrollIntoView({ block: 'start' });
</script>
</body>
</html>
