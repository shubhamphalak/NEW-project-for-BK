<!doctype html>
<html lang="en">
<meta charset="utf-8">
<style>html,body,iframe{margin:0;border:0;width:100%;height:100%;overflow:hidden;display:block}</style>
<body>
<script type="module">
  import { initialState } from '../src/flow.js';
  const query = new URLSearchParams(location.search);
  const lang = query.get('lang') || 'en';
  const view = query.get('view') || 'home';
  sessionStorage.setItem('art-insurance-demo-v1', JSON.stringify({
    ...initialState(), lang, open: true, stage: 'explore', exploreView: view
  }));
  const frame = document.createElement('iframe');
  frame.title = 'Explore insurance preview';
  frame.src = '../index.html';
  document.body.append(frame);
</script>
</body>
</html>
